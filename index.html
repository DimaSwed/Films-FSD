<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="КиноТрекер" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1c1c1c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Метаданные по умолчанию. Один и тот же index.html отдаётся на любой маршрут, поэтому краулеры
      без JS (мессенджеры, превью ссылок) видят их для всех страниц, а не только для главной.
      canonical и og:url здесь намеренно нет: их создаёт <PageMeta> (src/shared/ui/page-meta) для
      каждого маршрута. Остальное <PageMeta> подменяет на странице и возвращает при уходе.
      Домен дублируется в src/shared/config/site.ts — менять в обоих местах.
    -->
    <title>КиноТрекер — фильмы, трейлеры и списки к просмотру</title>
    <meta
      name="description"
      content="Подборки фильмов, поиск по жанрам, годам и странам, трейлеры, где смотреть онлайн и личные списки «К просмотру» и «Избранное» с входом через TMDB."
    />

    <!-- Open Graph -->
    <meta property="og:site_name" content="КиноТрекер" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="КиноТрекер — фильмы, трейлеры и списки к просмотру" />
    <meta
      property="og:description"
      content="Подборки фильмов, поиск по жанрам, годам и странам, трейлеры, где смотреть онлайн и личные списки «К просмотру» и «Избранное» с входом через TMDB."
    />
    <meta property="og:image" content="https://films-fsd.vercel.app/images/logo.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="КиноТрекер — фильмы, трейлеры и списки к просмотру" />
    <meta
      name="twitter:description"
      content="Подборки фильмов, поиск по жанрам, годам и странам, трейлеры, где смотреть онлайн и личные списки «К просмотру» и «Избранное» с входом через TMDB."
    />
    <meta name="twitter:image" content="https://films-fsd.vercel.app/images/logo.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "КиноТрекер",
        "url": "https://films-fsd.vercel.app/",
        "inLanguage": "ru-RU"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
